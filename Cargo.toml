[workspace]
members = [
    "xtask",
    "parser-rs",
    "crates/parser-pdf",
    "crates/parser-vid",
    "crates/parser-common",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
parser-rs = { path = "parser-rs" }
parser-pdf = { path = "crates/parser-pdf" }
parser-vid = { path = "crates/parser-vid" }
parser-common = { path = "crates/parser-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
tempfile = "3"

[profile.dev]
debug = 0
